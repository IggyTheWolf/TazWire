# TazWire (Taz 6 converted to core XZ) on the STOCK TAZ 6 RAMBo 1.3 board.
#
# UNTESTED: this config has not been run on a printer yet. Before the first print:
#   1. Heaters: bed to 40 C and hotend to 100 C, one at a time, hand on the power switch.
#   2. BLTouch, before homing Z: BLTOUCH_DEBUG COMMAND=pin_down, then pin_up, then QUERY_PROBE.
#      If the pin doesn't move, don't home Z.
#   3. Motors: STEPPER_BUZZ each one, then check directions with small moves
#      (diagonal motion on X or Z means a gantry motor is reversed).
#
# Based on klipper/tazwire-printer.cfg (the tested Archim2 config). Pins follow Klipper's
# config/printer-lulzbot-taz6-2017.cfg. Only board-specific sections changed.
#
# Firmware: Klipper make menuconfig -> Atmega AVR, atmega2560, 16 MHz, serial UART0.
# Flash with: make flash FLASH_DEVICE=/dev/serial/by-id/<your RAMBo>

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/REPLACE_WITH_RAMBO_SERIAL_ID

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

[input_shaper]
shaper_freq_x: 36.92  # frequency for the X mark of the test model
shaper_freq_y: 39.96  # frequency for the Y mark of the test model
shaper_type: mzv

#####################################################################
#   Stepper current and microstepping (RAMBo: A4982 drivers)
#####################################################################

# The RAMBo sets motor current with an AD5206 digipot, not per-stepper TMC settings.
# Channel order (LulzBot firmware DIGIPOT_CHANNELS and Klipper agree):
#   channel_1 = E0, channel_2 = E1, channel_3 unused, channel_4 = Z, channel_5 = X, channel_6 = Y
# scale 2.08 is Klipper's value for RAMBo 1.1 and later, so channels read in amps (peak).
# UNVERIFIED: the RAMBo sense-resistor value behind that scale was not found in a primary source.
#
# Values: the tested Archim2 currents converted from RMS to peak (x 1.414):
#   X, Y, Z: 0.75 A RMS -> 1.06 A   (digipot step 130)
#   E0:      0.678 A RMS -> 0.96 A  (digipot step 118)
# Upper bound: LulzBot's factory firmware ran steps 175 (X, Y) and 200 (Z, two motors) on the
# stock Moons MS17HD6P4150-01 motors, which are rated 1.5 A (Moons datasheet in the LulzBot
# archive). The values here are below that. If a motor skips, raise it in small steps, not past 1.43.
[ad5206 stepper_digipot]
enable_pin: PD7
scale: 2.08
channel_1: 0.96
channel_2: 0.0
channel_4: 1.06
channel_5: 1.06
channel_6: 1.06

# 16 microsteps on X, Y, Z, E0, E1 (MS1/MS2 pairs, all high)
[static_digital_output stepper_config]
pins:
    PG1, PG0,
    PK7, PG2,
    PK6, PK5,
    PK3, PK4,
    PK1, PK2

[static_digital_output yellow_led]
pins: !PB7

#####################################################################
#   Y Stepper Settings
#####################################################################

[stepper_y]
step_pin: PC1
dir_pin: !PL0                # same inversion as stock Taz 6; check direction
enable_pin: !PA6
microsteps: 16
rotation_distance: 32
# Y switch on the Y-MIN header. The stock Taz 6 harness lands the Y switch on the
# Y-MAX header (PA1); if it is still there, use ^PA1 instead. UNVERIFIED for TazWire.
endstop_pin: ^PB5
position_endstop: -15
position_min: -15
position_max: 306
homing_speed: 150

#####################################################################
#   XZ Stepper Settings
#####################################################################

### X Motor is on the left side next to the electronics case
[stepper_x]
step_pin: PC0
dir_pin: PL1                 # check direction (core XZ: wrong = diagonal motion)
enable_pin: !PA7
microsteps: 16
rotation_distance: 32
# X switch on the X-MIN header (X-MAX header would be ^PA2). UNVERIFIED for TazWire.
endstop_pin: ^PB6
position_endstop: -70
position_min: -70
position_max: 300
homing_speed: 150

### Z Motor is on the right side
# The RAMBo has two Z motor connectors on the SAME driver (stock Taz 6 ran both Z motors).
# Plug the right gantry motor into one of them and leave the other empty.
[stepper_z]
step_pin: PC2
dir_pin: PL2                 # check direction (core XZ: wrong = diagonal motion)
enable_pin: !PA5
microsteps: 16
rotation_distance: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -3
homing_speed: 100

#####################################################################
#   Extruder
#####################################################################

##-------------------------------------------------------------------
## settings for "KT-CP0181" H175 (E3D Hemera 1.75mm Revo)
##-------------------------------------------------------------------
# [extruder]
# step_pin: PC3
# dir_pin: !PL6
# enable_pin: !PA4
# microsteps: 16
# rotation_distance: 7.619
# nozzle_diameter: 0.400
# filament_diameter: 1.75
# heater_pin: PH6
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: PF0
# control: pid
# pid_Kp: 21.0
# pid_Ki: 1.78
# pid_Kd: 61.93
# min_temp: 0
# max_temp: 300
# min_extrude_temp: 140

#-------------------------------------------------------------------
# settings for "Angelfish" Aerostruder (E3D Titan Aero V6)
#-------------------------------------------------------------------
[extruder]
step_pin: PC3
dir_pin: !PL6                # Klipper's stock Taz 6 Aerostruder setting; check with a short extrude
enable_pin: !PA4
microsteps: 16
rotation_distance: 7.242
nozzle_diameter: 0.500
filament_diameter: 2.85
heater_pin: PH6              # EXT_HEAT0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF0              # THERM0
control: pid
pid_Kp: 21.0
pid_Ki: 1.78
pid_Kd: 61.93
min_temp: 0
max_temp: 300
min_extrude_temp: 140
max_extrude_only_velocity: 500
max_extrude_only_accel: 2000
max_extrude_cross_section: 50.0
max_extrude_only_distance: 140.0

#####################################################################
#   Bed Heater
#####################################################################

# Bed on the RAMBo bed output, as the factory Taz 6 ran it.
[heater_bed]
heater_pin: PE5              # BED_HEAT
sensor_type: Honeywell 100K 135-104LAG-J01
sensor_pin: PF2              # THERM2
control: pid
pid_Kp: 162.0
pid_Ki: 17.0
pid_Kd: 378.0
min_temp: 0
max_temp: 130

#####################################################################
#   Probe
#####################################################################

# BLTouch: signal (white) + GND (black) + 5V (red) on the Z-MIN header (PB4),
# control (orange) + GND (brown) on the Z-MAX header signal pin (PC7).
# UNVERIFIED: the control pin choice. Pins are from LulzBot's firmware; whether the RAMBo's
# endstop-header filtering lets the BLTouch control pulses through has not been checked.
# Test before homing: BLTOUCH_DEBUG COMMAND=pin_down, then pin_up, then QUERY_PROBE.
[bltouch]
sensor_pin: ^PB4
control_pin: PC7
pin_move_time: 0.680
#   The amount of time (in seconds) to wait for the BLTouch pin to
#   move up or down. The default is 0.680 seconds.
stow_on_each_sample: False
probe_with_touch_mode: True
x_offset: 0.0
y_offset: 25.0
z_offset: 1.5
samples: 2
sample_retract_dist: 3.0
samples_result: average
samples_tolerance: 0.200
samples_tolerance_retries: 2

[bed_mesh]
speed: 300
horizontal_move_z: 10
mesh_min: 35,35
mesh_max: 215,190
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5
algorithm: bicubic

[safe_z_home]
home_xy_position: 140,140 # Change coordinates to the center of your print bed
speed: 100
z_hop: 10                 # Move up 10mm

#####################################################################
#   Fan Control
#####################################################################

[fan]
pin: PH5                     # FAN0 (part cooling)

# Pin from Klipper's stock Taz 6 config only (LulzBot's firmware leaves FAN1 unassigned).
[heater_fan heatbreak_cooling_fan]
pin: PH3                     # FAN1

# Control box cooling fan on FAN2 (TAZ6_Wiring.pdf; LulzBot firmware pin 2 = PE4).
# Always on while Klipper runs, like the E3EZ case fan.
[output_pin control_box_fan]
pin: PE4
value: 1
shutdown_value: 1

#####################################################################
#   Display (stock Taz 6 LCD, stock cable to the RAMBo LCD header)
#####################################################################

[display]
lcd_type: st7920
cs_pin: PG4
sclk_pin: PJ2
sid_pin: PG3
encoder_pins: ^PJ6, ^PJ5     # swap the two if the knob scrolls the wrong way
click_pin: ^!PE2
menu_timeout: 5

#####################################################################
#   Macros
#####################################################################

[include fluidd.cfg]

##### Enable object exclusion #####
[exclude_object]

[gcode_macro G29]
# Preform the ABL by running G29 in the start GCODE script
gcode:
    BED_MESH

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    G0 X140 Y140 Z30 F3600

[gcode_macro MOVE_CENTER_BED]
gcode:
    G28                               ; Home Axis
    G0 X140 Y140 Z50  F6000           ; Move to center of bed

[gcode_macro Z_OFFSET]
gcode:
	M140 S110 ;set bed to 110
	M104 S240 ;set extruder to 240
	G28
	BED_MESH_CLEAR
	G0 Y140 X140
	Z_ENDSTOP_CALIBRATE

[gcode_macro PRINT_START]
gcode:

    {% set BED = params.BED|default(69)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(204)|int %}

    M117 Heating bed...
    M190 S{BED}             ; set final bed temperature and wait for it to be reached
    M104 S{EXTRUDER*0.80}   ; start preheating hotend to non-ooze temperature
    M117 Homing...
    G28
    M117 Calibrating mesh...
    BED_MESH_CALIBRATE

    #Purge Line Gcode
    G92 E0
    G90
    G0 X5 Y-5 F6000
    M117 Heating extruder...
    M109 S{EXTRUDER}            ; set final hotend temperature and wait for it
    G1 E12.0 F3600              ; prime filament
    PURGE_LINE                  ; call purge line
    G1 Z10.0 F600           ; move the platform down 10mm
    G92 E0                  ; zero the extruded length again
    G1 F9000
    M117 Printing

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-12.0 F3600                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    #G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} Z{th.axis_maximum.z - 2}F3600  ; park nozzle at rear
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    M117
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro PURGE_LINE]
gcode:
   M117 Purging...
    G0 Z0.4
    G91
    G1 X160 E15 F500  ;for 2.85 Filament
    #G1 X160 E30 F500 ;for 1.75 Filament
    G1 Z2 E-.5 F3000      ; retract slightly to try and reduce stringing
    G92 E0
    G90
